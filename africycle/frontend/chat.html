<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-title" content="Africycle">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <title>Messages - Africycle</title>
</head>
<body>
  <noscript><p class="msg msg-error noscript-notice">Africycle needs JavaScript. Turn it on in your browser's settings, then reload this page.</p></noscript>
  <header class="topbar">
    <a href="index.html" class="topbar-brand">
      <img src="assets/Africycle_logo.jpg" alt="">
      <span>Africycle</span>
    </a>
    <nav class="topbar-nav" aria-label="Main">
      <a id="backLink" href="index.html" class="btn btn-quiet">Dashboard</a>
      <button id="logoutBtn" class="btn btn-quiet" type="button">Log out</button>
    </nav>
  </header>

  <main class="dashboard-main">
    <h1 class="page-heading">Messages</h1>
    <p class="page-intro">Agree on pickup details with collectors and buyers.</p>

    <p id="pageMsg" class="msg" role="status" hidden></p>

    <div class="chat-layout">
      <section class="panel" aria-label="Conversations">
        <div class="conversation-list" id="conversationList">
          <p class="panel-hint">Loading...</p>
        </div>
      </section>

      <section class="panel thread-panel" aria-labelledby="threadTitle">
        <h2 id="threadTitle">Choose a conversation</h2>
        <p id="minorNotice" class="msg msg-info" hidden></p>
        <div class="thread" id="thread" aria-live="polite"></div>
        <form id="chatForm" class="chat-form" hidden>
          <input type="text" id="chatInput" aria-label="Message" maxlength="1000" placeholder="Write a message" autocomplete="off">
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </section>
    </div>
  </main>

  <script src="js/probe.js"></script>
  <script src="js/compat.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
