<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="color-scheme" content="light">
  <script src="js/i18n.js"></script>
  <meta name="apple-mobile-web-app-title" content="Africycle">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <title>Log in - Africycle</title>
</head>
<body class="auth-body">
  <noscript><p class="msg msg-error noscript-notice">Africycle needs JavaScript. Turn it on in your browser's settings, then reload this page.</p></noscript>
  <main class="auth-card">
    <div class="language-bar">
      <label class="language-menu" title="Language">
        <svg class="language-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="language-code" aria-hidden="true" translate="no">EN</span>
        <select data-language-menu aria-label="Language"></select>
      </label>
    </div>
    <img src="assets/Africycle_logo.jpg" alt="Africycle logo" class="auth-logo">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in with your phone number</p>

    <form id="loginForm" class="auth-form" novalidate>
      <label for="phoneCountry">Country</label>
      <select id="phoneCountry" autocomplete="country"></select>

      <label for="phoneNumber">Phone number</label>
      <div class="phone-input">
        <span class="phone-code" id="phoneCode" aria-hidden="true">+237</span>
        <input type="tel" id="phoneNumber" inputmode="tel" autocomplete="tel" maxlength="40" placeholder="6 71 23 45 67" required>
      </div>

      <label for="role">I am logging in as</label>
      <select id="role" required>
        <option value="" disabled selected>Choose your role</option>
        <option value="seller">Seller</option>
        <option value="buyer">Buyer</option>
        <option value="guardian">Parent or guardian</option>
        <option value="admin">Admin</option>
      </select>

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <label class="checkbox-label">
        <input type="checkbox" id="rememberMe">
        Stay logged in on this device
      </label>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
        <span id="btnText">Log in</span>
        <span id="btnSpinner" class="spinner" hidden></span>
      </button>

      <p id="formMsg" class="msg" role="alert" hidden></p>
    </form>

    <p class="auth-switch">New to Africycle? <a href="register.html">Create an account</a></p>
  </main>

  <div class="wave" aria-hidden="true">
    <svg viewBox="0 0 1440 160" preserveAspectRatio="none">
      <path d="M0,70 C240,130 480,10 720,60 C960,110 1200,30 1440,70 L1440,160 L0,160 Z" fill="#bcd8f2"/>
      <path d="M0,105 C260,60 520,150 780,110 C1040,70 1260,130 1440,100 L1440,160 L0,160 Z" fill="#1565c0"/>
    </svg>
  </div>

  <script src="js/probe.js"></script>
  <script src="js/compat.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/phone.js"></script>
  <script src="js/login.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
