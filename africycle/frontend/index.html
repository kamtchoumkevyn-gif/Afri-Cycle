<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-title" content="Africycle">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <title>Africycle</title>
</head>
<body class="auth-body">
  <noscript><p class="msg msg-error noscript-notice">Africycle needs JavaScript. Turn it on in your browser's settings, then reload this page.</p></noscript>
  <main class="auth-card landing-card">
    <img src="assets/Africycle_logo.jpg" alt="Africycle logo" class="auth-logo">
    <h1 class="landing-wordmark">AFRICYCLE</h1>
    <p class="landing-pitch">Find the buyer paying the best price for your scrap, water, or organic waste, close to where you are.</p>

    <div class="landing-actions">
      <a href="login.html" class="btn btn-primary btn-block">Log in</a>
      <a href="register.html" class="btn btn-secondary btn-block">Create an account</a>
    </div>

    <div class="install-box">
      <button id="installBtn" type="button" class="btn btn-quiet" hidden>Install Africycle as an app</button>
      <p id="iosInstallHint" class="field-hint" hidden>Use Africycle like an app: tap the Share button, then "Add to Home Screen".</p>
    </div>
  </main>

  <div class="wave" aria-hidden="true">
    <svg viewBox="0 0 1440 160" preserveAspectRatio="none">
      <path d="M0,70 C240,130 480,10 720,60 C960,110 1200,30 1440,70 L1440,160 L0,160 Z" fill="#bcd8f2"/>
      <path d="M0,105 C260,60 520,150 780,110 C1040,70 1260,130 1440,100 L1440,160 L0,160 Z" fill="#1565c0"/>
    </svg>
  </div>

  <script src="js/probe.js"></script>
  <script src="js/compat.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    // Already logged in: go straight to the right dashboard
    const existingUser = currentUser();
    if (existingUser) {
      window.location.replace(dashboardFor(existingUser.role));
    }
  </script>
</body>
</html>
