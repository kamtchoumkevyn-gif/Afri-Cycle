<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="color-scheme" content="light">
  <script src="js/i18n.js"></script>
  <meta name="apple-mobile-web-app-title" content="Africycle">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <title>Admin - Africycle</title>
</head>
<body>
  <noscript><p class="msg msg-error noscript-notice">Africycle needs JavaScript. Turn it on in your browser's settings, then reload this page.</p></noscript>
  <header class="topbar">
    <a href="admin-dashboard.html" class="topbar-brand">
      <img src="assets/Africycle_logo.jpg" alt="">
      <span translate="no">Africycle</span>
    </a>
    <nav class="topbar-nav" aria-label="Main">

      <label class="language-menu" title="Language">
        <svg class="language-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="language-code" aria-hidden="true" translate="no">EN</span>
        <select data-language-menu aria-label="Language"></select>
      </label>
      <button id="logoutBtn" class="btn btn-quiet" type="button">Log out</button>
    </nav>
  </header>

  <main class="dashboard-main">
    <h1 class="page-heading">Platform overview</h1>
    <p class="page-intro">Watch activity and review accounts that look suspicious.</p>

    <p id="pageMsg" class="msg" role="status" hidden></p>

    <section class="stats" aria-label="User counts">
      <div class="stat"><span class="stat-value" id="statTotal">-</span><span class="stat-label">Users</span></div>
      <div class="stat"><span class="stat-value" id="statSellers">-</span><span class="stat-label">Sellers</span></div>
      <div class="stat"><span class="stat-value" id="statBuyers">-</span><span class="stat-label">Buyers</span></div>
      <div class="stat"><span class="stat-value" id="statToday">-</span><span class="stat-label">Purchases today</span></div>
    </section>

    <section class="panel" aria-labelledby="activityHeading">
      <h2 id="activityHeading">Last 7 days</h2>
      <p class="panel-hint" id="activitySummary">Loading...</p>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Most traded material</th><th>Purchases</th></tr></thead>
          <tbody id="topMaterialsBody">
            <tr><td colspan="2" class="empty-row">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel" aria-labelledby="usersHeading">
      <h2 id="usersHeading">Accounts</h2>
      <label class="checkbox-label">
        <input type="checkbox" id="flaggedOnly">
        Show flagged accounts only
      </label>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Name</th><th>Phone</th><th>Role</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="usersBody">
            <tr><td colspan="5" class="empty-row">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/probe.js"></script>
  <script src="js/compat.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/phone.js"></script>
  <script src="js/admin-dashboard.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
