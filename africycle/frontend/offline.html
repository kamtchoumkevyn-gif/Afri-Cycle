<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="color-scheme" content="light">
  <script src="/js/i18n.js"></script>
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
  <title>Offline - Africycle</title>
</head>
<!-- Shown by the service worker when there's no connection and the page asked for isn't
     saved on the device. Absolute paths, because it can stand in for any address. -->
<body class="auth-body">
  <main class="auth-card landing-card">
    <img src="/assets/Africycle_logo.jpg" alt="Africycle logo" class="auth-logo">
    <h1 class="auth-title">You're offline</h1>
    <p class="auth-subtitle">Africycle needs a connection to find buyers, share your location and send messages. Check your mobile data or Wi-Fi, then try again.</p>
    <div class="landing-actions">
      <a href="/" class="btn btn-primary btn-block">Try again</a>
    </div>
  </main>
</body>
</html>
