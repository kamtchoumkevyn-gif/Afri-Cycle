// Africycle for Android: the website (https://afri-cycle.onrender.com) as an app.
// Build: ./gradlew assembleRelease   (see "Android app" in ../README.md)
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Africycle"
include ":app"
